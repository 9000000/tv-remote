<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest?k=__K__">
<link rel="icon" href="icon.png?k=__K__">
<link rel="stylesheet" href="app.css?k=__K__">
<title>TV Karaoke</title>
</head>
<body>
<header>
  <h1>TV Karaoke</h1>
  <span id="conn" class="dot" role="status"></span>
  <button id="who" class="chip" type="button"></button>
</header>

<section id="now" class="card now" hidden>
  <img id="nowImg" alt="" width="96" height="54">
  <div class="nowtxt"><b id="nowTitle"></b><span id="nowBy"></span></div>
  <div class="ctl">
    <button id="bPause" type="button"></button>
    <button id="bSkip" type="button"></button>
    <button id="bReplay" type="button"></button>
    <button id="bVolDn" type="button"></button>
    <button id="bVolUp" type="button"></button>
  </div>
</section>
<p id="idle" class="note"></p>

<nav id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="search" aria-selected="true"></button>
  <button type="button" role="tab" data-tab="queue"></button>
  <button type="button" role="tab" data-tab="settings"></button>
</nav>

<main>
  <section id="tab-search">
    <form id="sf" class="line">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off">
      <button id="sb" class="primary" type="submit"></button>
    </form>
    <p id="smsg" class="note" hidden></p>
    <ul id="results" class="list"></ul>
  </section>
  <section id="tab-queue" hidden>
    <ul id="queue" class="list"></ul>
    <p id="qempty" class="note"></p>
    <h2 id="hh" hidden></h2>
    <ul id="history" class="list"></ul>
  </section>
  <section id="tab-settings" hidden>
    <h2 id="nameH"></h2>
    <form id="nf" class="line"><input id="nameIn" maxlength="16" autocomplete="off"><button id="nameOk" class="primary" type="submit"></button></form>
    <h2 id="keyH"></h2>
    <p id="keyNote" class="note"></p>
    <form id="kf" class="line"><input id="keyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="keyOk" class="primary" type="submit"></button></form>
    <p id="keyState" class="note"></p>
    <button id="keyClear" type="button" class="plain"></button>
    <h2 id="micH"></h2>
    <p id="micNote" class="note"></p>
  </section>
</main>
<div id="toast" role="status" hidden></div>
<script src="app.js?k=__K__"></script>
</body>
</html>
