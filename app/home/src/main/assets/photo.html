<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>TV Home</title>
<style>
  :root { --bg:#0c1020; --card:#161b2b; --ink:#f2f4fa; --dim:#a6adc4; --acc:#8ab4f8; --acc-ink:#0b1020; --bad:#ff8a80; --ok:#7be0a1; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef1f8; --card:#fff; --ink:#151a2b; --dim:#586079; --acc:#2a5fd6; --acc-ink:#fff; --bad:#c0392b; --ok:#16794a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 32px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:20px; margin:4px 0 0; }
  .card { background:var(--card); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  canvas { width:100%; height:auto; aspect-ratio:16/9; border-radius:12px; background:#000; touch-action:none; display:block; }
  p { margin:0; color:var(--dim); font-size:14px; }
  button, label.btn { appearance:none; border:0; border-radius:14px; min-height:48px; padding:0 18px; font:inherit; font-weight:600; background:#ffffff1f; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; text-align:center; }
  button.primary { background:var(--acc); color:var(--acc-ink); }
  button:disabled { opacity:.5; }
  input[type=file] { display:none; }
  .bar { height:8px; border-radius:4px; background:#ffffff1f; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .15s; }
  .msg { font-weight:600; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  h2 { font-size:16px; margin:0; }
  input[type=url] { appearance:none; border:1px solid #ffffff2e; border-radius:14px; min-height:48px; padding:0 14px; font:inherit; background:#ffffff12; color:var(--ink); width:100%; }
  input[type=url]:focus { outline:2px solid var(--acc); outline-offset:1px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="card">
    <label class="btn" id="pick"><input type="file" id="file" accept="image/*"><span id="picktext"></span></label>
    <div id="edit" hidden>
      <canvas id="cv" width="640" height="360"></canvas>
      <p id="hint"></p>
    </div>
    <div class="bar" id="bar" hidden><i id="fill"></i></div>
    <p class="msg" id="msg" hidden></p>
    <button class="primary" id="send" hidden></button>
  </div>
  <div class="card">
    <h2 id="webtitle"></h2>
    <input type="url" id="weburl" inputmode="url" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="500">
    <p id="webhint"></p>
    <p class="msg" id="webmsg" hidden></p>
    <button class="primary" id="websend"></button>
  </div>
</main>
<!-- The words and the TV's picture size come from the TV (PhotoServer.page) in the phone's language. -->
<script>window.CFG = __CFG__;</script>
<script src="photofit.js?k=__K__"></script>
<script>
(function () {
  var C = window.CFG, T = C.t, W = C.w, H = C.h;
  var $ = function (id) { return document.getElementById(id); };
  var key = new URLSearchParams(location.search).get('k') || '';
  var img = null, view = null, busy = false;
  $('title').textContent = T.pg_title; $('hint').textContent = T.pg_hint; document.title = T.pg_title;
  $('picktext').textContent = T.pg_pick;
  // a web page as the background: the same rules as the TV's settings (http or https, a host, at most 500 characters); the TV checks again
  $('webtitle').textContent = T.pg_web_title; $('webhint').textContent = T.pg_web_hint; $('websend').textContent = T.pg_web_use;
  $('weburl').placeholder = T.pg_web_ph; $('weburl').value = C.web || '';
  function webSay(text, cls) { var m = $('webmsg'); m.textContent = text; m.className = 'msg ' + (cls || ''); m.hidden = !text; }
  $('websend').onclick = function () {
    var u = $('weburl').value.trim();
    if (u.length > 500 || !/^https?:\/\/[^\s\/?#]+\S*$/i.test(u)) return webSay(T.pg_web_bad, 'bad');
    var b = $('websend'); b.disabled = true; webSay('');
    var x = new XMLHttpRequest();
    x.open('POST', '/web?k=' + encodeURIComponent(key));
    x.setRequestHeader('Content-Type', 'text/plain; charset=utf-8');
    x.onload = function () { b.disabled = false; webSay(x.status === 200 ? T.pg_done : x.status === 403 ? T.pg_gone : x.status === 400 ? T.pg_web_bad : T.pg_err, x.status === 200 ? 'ok' : 'bad'); };
    x.onerror = function () { b.disabled = false; webSay(T.pg_err, 'bad'); };
    x.send(u);
  };
  $('weburl').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('websend').click(); });
  var cv = $('cv'); cv.height = Math.round(cv.width * H / W);
  function say(text, cls) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); m.hidden = !text; }
  var raw = null;                       // a photo this browser cannot open (HEIC, too many pixels): sent as it is, the TV cuts it
  function kind(f) { return ((f.name || '').split('.').pop() || f.type || '?').toUpperCase() + ', ' + (f.size / 1048576).toFixed(1) + ' MB'; }
  $('file').onchange = function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    say(''); raw = null; img = null;
    // the browser applies the photo's rotation (EXIF) itself, so a portrait phone photo is not turned on its side
    photoOpen(f).then(function (b) {
      img = b;
      $('edit').hidden = false; view = photoCrop(replaceCanvas(), img);
      $('send').hidden = false; $('send').disabled = false; $('send').textContent = T.pg_send;
      $('picktext').textContent = T.pg_other; $('bar').hidden = true;
    }).catch(function () {
      raw = f; $('edit').hidden = true; $('bar').hidden = true;
      $('send').hidden = false; $('send').disabled = false; $('send').textContent = T.pg_send; $('picktext').textContent = T.pg_other;
      say(T.pg_raw + ' (' + kind(f) + ')');
    });
  };
  // a new photo gets a fresh canvas: the old one still carries the drag handlers of the previous photo
  function replaceCanvas() { var n = cv.cloneNode(false); cv.parentNode.replaceChild(n, cv); cv = n; return n; }
  $('send').onclick = function () {
    if (busy || !(img || raw)) return; busy = true; $('send').disabled = true; say('');
    $('bar').hidden = false; $('fill').style.width = '0%';
    (raw ? Promise.resolve(raw) : photoBlob(img, W, H, view, 0.85)).then(function (blob) {
      var x = new XMLHttpRequest();
      x.open('POST', '/photo?k=' + encodeURIComponent(key) + (raw ? '&raw=1' : ''));
      x.setRequestHeader('Content-Type', 'application/octet-stream');
      x.upload.onprogress = function (e) {
        if (!e.lengthComputable) return; var p = Math.round(100 * e.loaded / e.total);
        $('fill').style.width = p + '%'; say(T.pg_sending.replace('{p}', p));
      };
      x.onload = function () {
        busy = false;
        if (x.status === 200) { $('fill').style.width = '100%'; say(T.pg_done, 'ok'); $('send').hidden = true; $('edit').hidden = true; $('bar').hidden = true; return; }
        $('send').disabled = false; $('bar').hidden = true;
        say(x.status === 403 ? T.pg_gone : x.status === 413 ? T.pg_err_big : x.status === 409 ? T.pg_err_full : x.status === 415 ? T.pg_err_image + (raw ? ' (' + kind(raw) + ')' : '') : T.pg_err, 'bad');
      };
      x.onerror = function () { busy = false; $('send').disabled = false; $('bar').hidden = true; say(T.pg_err, 'bad'); };
      x.send(blob);
    }).catch(function () { busy = false; $('send').disabled = false; $('bar').hidden = true; say(T.pg_err, 'bad'); });
  };
})();
</script>
</body>
</html>
