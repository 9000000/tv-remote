<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111418">
<title>TV Remote</title>
<style>
  :root { --bg:#f3f4f7; --card:#fff; --ink:#1a1d23; --muted:#667080; --line:#e1e4ea; --btn:#eceff3; --btn-hi:#dde2e9; --accent:#2f6df6; --accent-ink:#fff; --bad:#d23d3d; --ok:#17894a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f25; --ink:#e9ecf1; --muted:#99a3b0; --line:#2b3139; --btn:#272d35; --btn-hi:#363e49; --accent:#5b8cff; --accent-ink:#0b1020; --bad:#ff7070; --ok:#46d283; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:light dark; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:420px; margin:0 auto; padding:14px 14px 28px; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:860px) { main.wide { max-width:860px; display:grid; grid-template-columns:400px 1fr; align-items:start; } main.wide header { grid-column:1 / -1; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:18px; margin:0; } .sub { color:var(--muted); font-size:13px; } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; } .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  h2 { font-size:12px; margin:0 0 10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  button { font:inherit; color:var(--ink); background:var(--btn); border:0; border-radius:16px; min-height:52px; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; display:flex; align-items:center; justify-content:center; gap:3px; flex-direction:column; padding:0; }
  button:hover { background:var(--btn-hi); } button:active { transform:scale(.97); } button.held { background:#f59e0b !important; color:#1a1200 !important; }
  .ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .rc { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .rrow { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%; } .rrow.three { grid-template-columns:repeat(3,1fr); } .rrow.five { grid-template-columns:repeat(5,1fr); gap:8px; }
  button small { font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .power { color:var(--bad); } .play { background:var(--ink); color:var(--card); } .play:hover { background:var(--ink); }
  .dpad { position:relative; width:min(250px, 70vw); aspect-ratio:1; border-radius:50%; background:var(--btn); border:1px solid var(--line); box-shadow:inset 0 2px 12px rgba(0,0,0,.18); }
  .dpad button { position:absolute; width:34%; height:34%; min-height:0; background:transparent; border-radius:50%; color:var(--muted); } .dpad .ic { width:28px; height:28px; }
  .dpad .up { top:2%; left:33%; } .dpad .down { bottom:2%; left:33%; } .dpad .left { left:2%; top:33%; } .dpad .right { right:2%; top:33%; }
  .dpad .ok { top:31%; left:31%; width:38%; height:38%; background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .vol { display:flex; align-items:center; gap:10px; width:100%; } .vol button { width:46px; min-height:46px; border-radius:50%; flex:none; } .vol .bar { flex:1; height:8px; border-radius:4px; background:var(--btn); overflow:hidden; } .vol .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .vol output { width:54px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; } .vol .on { color:var(--bad); }
  form { display:flex; gap:8px; } input { flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:50px; }
  form button { width:56px; flex:none; } .primary { background:var(--accent); color:var(--accent-ink); font-weight:700; } .primary:hover { background:var(--accent); filter:brightness(1.08); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
  .tile { background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:10px 6px 8px; min-height:0; gap:8px; font-size:12px; line-height:1.2; }
  .tile img { width:100%; aspect-ratio:16/9; object-fit:contain; border-radius:8px; display:block; } .tile span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .muted { color:var(--muted); font-size:13px; } [hidden] { display:none !important; }
  .pair { text-align:center; padding:28px 18px; } .pair p { margin:8px 0 16px; } .pair input { text-align:center; font-size:26px; letter-spacing:.3em; font-weight:700; }
  .pair form { max-width:300px; margin:0 auto; } .err { color:var(--bad); min-height:22px; font-size:14px; margin-top:10px; }
  .warn { background:rgba(245,158,11,.15); border-radius:14px; padding:10px 12px; font-size:13px; }
  nav { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:5px; position:sticky; top:8px; z-index:5; }
  nav button { flex:1; min-width:0; min-height:46px; background:transparent; border-radius:12px; font-size:11px; gap:2px; white-space:nowrap; } nav button .ic { width:20px; height:20px; }
  nav button[aria-selected=true] { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .panel { display:flex; flex-direction:column; gap:14px; }
  @media (min-width:860px) { main.wide { max-width:900px; } .panel.two { display:grid; grid-template-columns:400px 1fr; align-items:start; } }
  .small { min-height:38px; padding:0 12px; font-size:13px; border-radius:12px; flex-direction:row; gap:6px; flex:none; } .danger { color:var(--bad); }
  .list { display:flex; flex-direction:column; } .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); min-width:0; } .item:first-child { border-top:0; }
  .item .name { flex:1; min-width:0; overflow-wrap:anywhere; font-size:14px; } .item .name small { display:block; color:var(--muted); font-size:12px; } .item.click { cursor:pointer; }
  .item .acts { display:flex; gap:6px; }
  .item img, .ficon { width:36px; height:36px; border-radius:9px; flex:none; object-fit:contain; background:var(--btn); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .more { width:38px; padding:0; font-size:20px; line-height:1; }
  .sheet { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
  .sheet > div { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .sheet h3 { margin:2px 4px 6px; font-size:15px; overflow-wrap:anywhere; } .sheet button { min-height:48px; border-radius:14px; background:var(--btn); color:var(--ink); font-size:15px; flex-direction:row; }
  .sheet .primary { background:var(--accent); color:var(--accent-ink); font-weight:700; } .sheet .danger { color:var(--bad); } .sheet .quiet { background:transparent; color:var(--muted); }
  @media (min-width:640px) { .sheet { align-items:center; } .sheet > div { border-radius:20px; } }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:14px; margin:10px 0 4px; } .crumbs button { min-height:32px; padding:0 8px; background:transparent; border-radius:8px; flex-direction:row; }
  .crumbs button:last-of-type { font-weight:700; } .places { display:flex; gap:6px; flex-wrap:wrap; } .places button { min-height:34px; padding:0 12px; font-size:13px; border-radius:999px; flex-direction:row; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .tools input { min-height:40px; font-size:14px; }
  .drop { display:flex; align-items:center; justify-content:center; min-height:52px; border:1.5px dashed var(--line); border-radius:14px; margin-top:10px; cursor:pointer; color:var(--muted); font-size:14px; text-align:center; padding:6px 10px; } .drop input { display:none; }
  .kv { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; font-size:14px; } .kv .k { color:var(--muted); overflow-wrap:anywhere; min-width:0; } .kv .v { font-weight:600; text-align:right; max-width:60vw; overflow-wrap:anywhere; }
  .meter { margin:10px 0 0; font-size:14px; } .meter .top { display:flex; justify-content:space-between; gap:8px; } .mbar { height:10px; border-radius:5px; background:var(--btn); overflow:hidden; margin-top:6px; } .mbar i { display:block; height:100%; background:var(--accent); border-radius:5px; }
  .meter.hi .mbar i { background:#f59e0b; } .meter.max .mbar i { background:var(--bad); }
  .job { padding:8px 0; border-top:1px solid var(--line); font-size:13px; } .job:first-child { border-top:0; } .job.error .msg { color:var(--bad); } .job.done .msg { color:var(--ok); }
  .term { background:#0b0d10; color:#d7e0ea; border-radius:12px; padding:12px; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; height:min(52vh, 460px); overflow:auto; margin:0 0 10px; }
  .term .cmd { color:#7fb0ff; } .term .err { color:#ff8a80; } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:20; } #toast.show { opacity:.94; }
  input[type=checkbox] { flex:none; min-height:0; width:18px; height:18px; padding:0; accent-color:var(--accent); }
  label.chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); cursor:pointer; margin:8px 0; }
  .lang { min-height:36px; padding:0 12px; font-size:13px; border-radius:12px; flex-direction:row; }
</style>
</head>

<main id="main">
  <header class="card">
    <div><h1 id="name">TV Remote</h1><div class="sub"><span class="dot" id="dot"></span><span id="status">...</span></div></div>
    <button class="lang" id="lang">EN</button>
  </header>

  <nav id="nav" hidden>
    <button data-tab="remote" aria-selected="true"><svg class="ic"><use href="#i-apps"/></svg><span>Remote</span></button>
    <button data-tab="apps"><svg class="ic"><use href="#i-menu"/></svg><span data-t="t_apps"></span></button>
    <button data-tab="files"><svg class="ic"><use href="#i-input"/></svg><span data-t="t_files"></span></button>
    <button data-tab="install"><svg class="ic"><use href="#i-plus"/></svg><span data-t="t_install"></span></button>
    <button data-tab="health"><svg class="ic"><use href="#i-settings"/></svg><span data-t="t_health"></span></button>
    <button data-tab="term"><svg class="ic"><use href="#i-enter"/></svg><span>Terminal</span></button>
  </nav>

  <section class="card pair" id="pair" hidden>
    <h1 data-t="pair_title"></h1>
    <p class="muted" data-t="pair_text"></p>
    <button class="primary" id="pairstart" style="width:100%;max-width:300px;margin:0 auto" data-t="pair_show"></button>
    <form id="pairf" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000"><button class="primary"><svg class="ic"><use href="#i-check"/></svg></button></form>
    <div class="err" id="pairerr"></div>
  </section>

  <div class="panel two" data-panel="remote" hidden>
  <section class="card rc" id="remote">
    <div class="warn" id="adbwarn" hidden></div>
    <div class="rrow">
      <button class="power" data-k="POWER"><svg class="ic"><use href="#i-power"/></svg></button>
      <button data-k="MENU"><svg class="ic"><use href="#i-menu"/></svg></button>
      <button data-k="SETTINGS"><svg class="ic"><use href="#i-settings"/></svg></button>
      <button data-k="INPUT"><svg class="ic"><use href="#i-input"/></svg></button>
      <button data-k="ASSIST" title="Google Assistant"><svg class="ic"><use href="#i-mic"/></svg></button>
    </div>
    <div class="dpad">
      <button class="up" data-k="UP"><svg class="ic"><use href="#i-up"/></svg></button>
      <button class="left" data-k="LEFT"><svg class="ic"><use href="#i-left"/></svg></button>
      <button class="ok" data-k="OK">OK</button>
      <button class="right" data-k="RIGHT"><svg class="ic"><use href="#i-right"/></svg></button>
      <button class="down" data-k="DOWN"><svg class="ic"><use href="#i-down"/></svg></button>
    </div>
    <div class="rrow three">
      <button data-k="BACK" style="min-height:60px"><svg class="ic"><use href="#i-back"/></svg><small data-t="back"></small></button>
      <button data-k="HOME" style="min-height:60px"><svg class="ic"><use href="#i-home"/></svg><small>Home</small></button>
      <button data-k="MUTE" id="mute" style="min-height:60px"><svg class="ic"><use href="#i-mute"/></svg><small data-t="mute"></small></button>
    </div>
    <div class="vol">
      <button data-k="VOL_DOWN"><svg class="ic"><use href="#i-minus"/></svg></button>
      <div class="bar"><i id="volbar"></i></div>
      <button data-k="VOL_UP"><svg class="ic"><use href="#i-plus"/></svg></button>
      <output id="volv">–</output>
    </div>
    <div class="rrow three">
      <button data-k="PREV"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="play" data-k="PLAY_PAUSE"><svg class="ic"><use href="#i-play_pause"/></svg></button>
      <button data-k="NEXT"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <form id="textf" style="width:100%"><input id="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="primary" id="textsend"><svg class="ic"><use href="#i-send"/></svg></button><button type="button" id="ask"><svg class="ic"><use href="#i-search"/></svg></button></form>
    <div class="rrow three">
      <button data-k="DEL"><svg class="ic"><use href="#i-backspace"/></svg></button>
      <button data-k="ENTER"><svg class="ic"><use href="#i-enter"/></svg></button>
      <button data-k="WAKE"><svg class="ic"><use href="#i-wake"/></svg></button>
    </div>
  </section>

  <section class="card" id="appscard">
    <h2 data-t="apps"></h2>
    <div class="tiles" id="apps"></div>
  </section>
  </div>

  <div class="panel" data-panel="apps" hidden>
    <section class="card">
      <div class="tools"><input type="search" id="appsq" autocomplete="off" style="flex:1"><button class="small" id="appsreload">↻</button></div>
      <label class="chk"><input type="checkbox" id="appssys"> <span data-t="sys"></span></label>
      <div class="list" id="appslist"></div>
    </section>
  </div>

  <div class="panel" data-panel="files" hidden>
    <section class="card">
      <div class="places" id="places"></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="tools"><input type="search" id="filesq" autocomplete="off" style="flex:1"><button class="small" id="mkdir">＋ <span data-t="folder"></span></button><button class="small" id="filesreload">↻</button></div>
      <div class="muted" id="space" style="margin-top:8px"></div>
      <div class="list" id="fileslist" style="margin-top:6px"></div>
      <label class="drop"><input type="file" id="upfile" multiple><span data-t="upload"></span></label>
    </section>
  </div>

  <div class="panel" data-panel="install" hidden>
    <section class="card">
      <h2 data-t="inst_apk"></h2>

let lang = 'vi';
try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || ((navigator.language || 'vi').toLowerCase().startsWith('vi') ? 'vi' : 'en'); } catch {}
const t = (k, ...a) => { let v = T[lang][k] || k; a.forEach((x, i) => { v = v.replace('{' + i + '}', x); }); return v; };
const EMBED = new URLSearchParams(location.search).has('embed');   // inside the phone app: it has its own remote screen and no pairing
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = t(e.dataset.t); });
  $('#text').placeholder = t('text'); $('#lang').textContent = lang === 'vi' ? 'EN' : 'VI';

}
$('#lang').addEventListener('click', () => { lang = lang === 'vi' ? 'en' : 'vi'; try { localStorage.setItem('lang', lang); } catch {} applyLang(); refresh(); showTab(tab); });

async function api(path, body) {
  try {
    const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  } catch { return { status: 0 }; }
}

// ---------- pairing ----------
let paired = null, appsLoaded = false;
function show(isPaired) {
  if (paired === isPaired) return;
  paired = isPaired;
  $('#pair').hidden = isPaired; $('#nav').hidden = !isPaired; $('#main').classList.toggle('wide', isPaired);
  if (isPaired) showTab(tab); else document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = true; });
  if (isPaired && !appsLoaded && !EMBED) loadApps();
}
$('#pairstart').addEventListener('click', async () => {
  const r = await api('/api/pair/start', {});
  if (r.status === 200) { $('#pairf').hidden = false; $('#pairerr').textContent = t('wait'); $('#code').value = ''; $('#code').focus(); }
});
$('#pairf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await api('/api/pair/finish', { code: $('#code').value });
  if (r.status === 200) { $('#pairerr').textContent = ''; refresh(); }
  else { $('#pairerr').textContent = t(r.error === 'wrong' ? 'wrong' : 'expired'); if (r.error !== 'wrong') $('#pairf').hidden = true; $('#code').select(); }
});

// ---------- state ----------
let tvOn = false;                                              // turning it off asks first, turning it on does not
async function refresh() {
  const s = await api('/api/state');
  if (s.status === 401) { $('#name').textContent = s.name || 'TV Remote'; $('#status').textContent = ''; $('#dot').className = 'dot'; show(false); return; }
  if (s.status !== 200) { $('#status').textContent = t('lost'); $('#dot').className = 'dot bad'; return; }
  show(true); tvOn = !!s.on;
  $('#name').textContent = s.name; document.title = s.name + ' · Remote';
  $('#status').textContent = t(s.on ? 'on' : 'off'); $('#dot').className = 'dot ' + (s.on ? 'ok' : '');
  $('#volv').textContent = s.volume + ' / ' + s.volume_max; $('#volbar').style.width = (s.volume_max ? s.volume * 100 / s.volume_max : 0) + '%';
  $('#mute').classList.toggle('power', !!s.muted);
  const w = $('#adbwarn'); w.hidden = s.adb === 'ready'; if (s.adb !== 'ready') w.textContent = t(s.adb === 'allow' ? 'adb_allow' : 'adb_off');
}

// ---------- keys: tap = one press, hold = long press on the TV ----------
document.querySelectorAll('[data-k]').forEach((b) => {
  const key = b.dataset.k; let timer = null, long = false, down = false;
  const send = (action) => { if (key === 'POWER' && tvOn && !confirm(t('ask_off'))) return; api('/api/key', { key, action }).then(() => setTimeout(refresh, 300)); };
  const release = (tap) => {
    if (!down) return; down = false; clearTimeout(timer);
    if (long) { long = false; b.classList.remove('held'); send('up'); } else if (tap) send('press');
  };
  b.addEventListener('pointerdown', (e) => {
    if (e.button) return; down = true; long = false; try { b.setPointerCapture(e.pointerId); } catch {}
    if (key !== 'POWER') timer = setTimeout(() => { long = true; b.classList.add('held'); send('down'); }, 400);
  });
  b.addEventListener('pointerup', () => { release(true); b.blur(); });
  ['pointercancel', 'lostpointercapture'].forEach((ev) => b.addEventListener(ev, () => release(false)));
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
$('#textf').addEventListener('submit', async (e) => { e.preventDefault(); const v = $('#text').value; if (v) { await api('/api/text', { text: v }); $('#text').value = ''; } });
// the magnifier hands the sentence to the TV's own search / Assistant instead of typing it
$('#ask').addEventListener('click', async () => { const v = $('#text').value.trim(); if (v && (await api('/api/m/search', { query: v })).status === 200) $('#text').value = ''; });

// the computer's keyboard works as the remote while no text box is focused
const KEYMAP = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Enter: 'OK', Escape: 'BACK', Backspace: 'DEL', ' ': 'PLAY_PAUSE' };
document.addEventListener('keydown', (e) => {
  if (!paired || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey || !KEYMAP[e.key]) return;
  e.preventDefault(); api('/api/key', { key: KEYMAP[e.key], action: 'press' });
});

// ---------- apps ----------
async function loadApps() {
  const r = await api('/api/apps'); if (r.status !== 200) return;
  appsLoaded = true;
  r.apps.sort((a, b) => a.label.localeCompare(b.label));
  $('#apps').replaceChildren(...r.apps.map((a) => {
    const b = document.createElement('button'); b.className = 'tile'; b.title = a.label;
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = '/api/icon?pkg=' + encodeURIComponent(a.pkg);
    const s = document.createElement('span'); s.textContent = a.label;
    b.append(img, s); b.addEventListener('click', () => api('/api/launch', { component: a.component }));
    return b;
  }));
}


// ---------- tabs ----------
let tab = new URLSearchParams(location.search).get('tab') || (EMBED ? 'apps' : 'remote');
function showTab(name) {
  tab = name;
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === name));
  document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== name; });
  if (name === 'apps') loadAllApps(); if (name === 'files') loadFiles(cwd); if (name === 'health') loadHealth();
}
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
if (EMBED) { document.querySelector('[data-tab=remote]').hidden = true; document.querySelector('header').hidden = true; }

const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); kids.forEach((k) => k != null && e.append(k)); return e; };
const fmtSize = (n) => n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? Math.round(n / 1e3) + ' KB' : n + ' B';
// a row's actions live behind its "⋯" button: a sheet with one big button per action
function sheet(title, actions) {
  const close = () => box.remove();
  const box = el('div', { className: 'sheet', onclick: (e) => e.target === box && close() }, el('div', {}, el('h3', { textContent: title }),
    ...actions.map((a) => el('button', { className: a.cls || '', textContent: a.label, onclick: () => { close(); a.fn(); } })),
    el('button', { className: 'quiet', textContent: t('cancel'), onclick: close })));
  document.body.append(box);
}
const more = (title, actions) => el('button', { className: 'small more', textContent: '⋯', title: t('more'), onclick: (e) => { e.stopPropagation(); sheet(title, actions()); } });
let toastT; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2600); }
// one place that explains ADB trouble for every tab that needs it
async function m(path, body) {
  const r = await api('/api/m/' + path, body);
  const e = $('#adberr');
  if (r.status === 503) { e.hidden = false; e.textContent = t(String(r.error).includes('allow') ? 'adb_allow' : 'adb_off'); return null; }
  e.hidden = true;
  if (r.status !== 200) { toast(r.error || 'error'); return null; }
  return r;
}

// ---------- all apps: open, stop, uninstall ----------
let allApps = null, appIcons = false;
async function loadAllApps(force) {
  if (allApps && !force) return renderApps();
  $('#appslist').replaceChildren(el('div', { className: 'muted', textContent: t('loading') }));
  const r = await m('apps?system=' + ($('#appssys').checked ? 1 : 0)); if (!r) return;
  allApps = r.apps; appIcons = r.icons; renderApps();
}
function renderApps() {
  const q = $('#appsq').value.trim().toLowerCase();
  const rows = allApps.filter((a) => !q || a.pkg.toLowerCase().includes(q) || a.label.toLowerCase().includes(q)).sort((a, b) => a.label.localeCompare(b.label)).map((a) => {
    const run = (action, label) => async () => {
      if (action === 'uninstall' && !confirm(t('ask_remove', a.label))) return;
      if (await m('app', { pkg: a.pkg, action })) { toast(label + ': ' + a.label); if (action === 'uninstall') { appsLoaded = false; loadAllApps(true); } }
    };
    const icon = appIcons ? el('img', { loading: 'lazy', alt: '', src: '/api/icon?pkg=' + encodeURIComponent(a.pkg) }) : el('div', { className: 'ficon', textContent: a.label.slice(0, 1).toUpperCase() });
    return el('div', { className: 'item' }, icon, el('div', { className: 'name' }, el('span', { textContent: a.label }), el('small', { textContent: a.pkg })),
      el('div', { className: 'acts' }, el('button', { className: 'small primary', textContent: t('open'), onclick: run('launch', t('open')) }),
        more(a.label, () => [{ label: t('open'), cls: 'primary', fn: run('launch', t('open')) }, { label: t('stop'), fn: run('stop', t('stop')) }, { label: t('remove'), cls: 'danger', fn: run('uninstall', t('remove')) }])));
  });
  $('#appslist').replaceChildren(...(rows.length ? rows : [el('div', { className: 'muted', textContent: t('none') })]));
}
$('#appsq').addEventListener('input', () => allApps && renderApps());
$('#appssys').addEventListener('change', () => loadAllApps(true));
$('#appsreload').addEventListener('click', () => loadAllApps(true));

// ---------- files ----------
let cwd = '/sdcard/Download', listing = [];
const kindOf = (n) => { const x = n.split('.').pop().toLowerCase(); return ['mp4', 'mkv', 'webm', 'avi', 'mov', 'm4v'].includes(x) ? 'video' : ['mp3', 'm4a', 'flac', 'wav', 'ogg'].includes(x) ? 'audio' : ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(x) ? 'image' : x === 'apk' ? 'apk' : 'file'; };
const ICON = { dir: '📁', video: '🎬', audio: '🎵', image: '🖼️', apk: '📦', file: '📄' };
async function loadFiles(path) {
  const r = await m('files?path=' + encodeURIComponent(path)); if (!r) return;
  cwd = r.path; listing = r.items;
  const places = [['/sdcard', t('tvmem')], ['/sdcard/Download', 'Download'], ['/sdcard/Movies', t('movies')], ['/sdcard/Pictures', t('pics')], ['/sdcard/Music', t('music')], ...r.usb.map((u) => ['/storage/' + u, 'USB ' + u])];
  $('#places').replaceChildren(...places.map(([p, label]) => el('button', { textContent: label, className: cwd === p ? 'primary' : '', onclick: () => loadFiles(p) })));
  const parts = cwd.split('/').filter(Boolean), crumbs = [];
  parts.forEach((p, i) => { if (i) crumbs.push(el('span', { className: 'muted', textContent: '›' })); crumbs.push(el('button', { textContent: p, onclick: () => loadFiles('/' + parts.slice(0, i + 1).join('/')) })); });
  $('#crumbs').replaceChildren(...crumbs);
  $('#space').textContent = r.total ? t('free', fmtSize(r.free), fmtSize(r.total), r.items.length) : t('items', r.items.length);
  $('#filesq').value = ''; renderFiles();
}
async function fileAct(op, body, msg) { if (await m(op, body)) { toast(msg || t('done')); loadFiles(cwd); } }
function renderFiles() {
  const q = $('#filesq').value.trim().toLowerCase();
  const rows = listing.filter((i) => !q || i.name.toLowerCase().includes(q)).map((i) => {
    const full = cwd + '/' + i.name, kind = i.dir ? 'dir' : kindOf(i.name), acts = el('div', { className: 'acts' });
    const install = () => { if (confirm(t('ask_inst', i.name))) startJob('install', { path: full }); };
    if (kind === 'apk') acts.append(el('button', { className: 'small primary', textContent: t('inst'), onclick: install }));
    acts.append(more(i.name, () => [
      i.dir && { label: t('opendir'), cls: 'primary', fn: () => loadFiles(full) },
      kind === 'apk' && { label: t('inst'), cls: 'primary', fn: install },
      ['video', 'audio', 'image'].includes(kind) && { label: t('onTv'), cls: 'primary', fn: () => m('open', { path: full }).then((r) => r && toast(t('onTv') + ': ' + i.name)) },
      !i.dir && { label: t('dl'), fn: () => { location.href = '/api/m/file?path=' + encodeURIComponent(full); } },   // sent as an attachment: the page stays
      { label: t('ren'), fn: () => { const n = prompt(t('newname'), i.name); if (n && n !== i.name) fileAct('rename', { path: full, name: n }); } },
      { label: t('del'), cls: 'danger', fn: () => { if (confirm(t(i.dir ? 'ask_deldir' : 'ask_del', i.name))) fileAct('delete', { path: full }); } },
    ].filter(Boolean)));
    return el('div', { className: 'item' + (i.dir ? ' click' : ''), onclick: i.dir ? () => loadFiles(full) : null }, el('div', { className: 'ficon', textContent: ICON[kind] }),
      el('div', { className: 'name' }, el('span', { textContent: i.name }), el('small', { textContent: (i.dir ? t('folder') : fmtSize(i.size)) + ' · ' + i.mtime })), acts);
  });
  $('#fileslist').replaceChildren(...(rows.length ? rows : [el('div', { className: 'muted', textContent: t('none') })]));
}
$('#filesq').addEventListener('input', renderFiles);
$('#filesreload').addEventListener('click', () => loadFiles(cwd));
$('#mkdir').addEventListener('click', () => { const n = prompt(t('newfolder')); if (n) fileAct('mkdir', { path: cwd, name: n }); });

// ---------- progress rows: uploads (the browser reports progress) and jobs on the app's side (polled) ----------
const jobRows = new Map();
function showJob(id, title, cls, msg, pct) {
  $('#jobscard').hidden = false;
  let row = jobRows.get(id);
  if (!row) { row = el('div', { className: 'job' }, el('b'), el('div', { className: 'msg' }), el('div', { className: 'mbar' }, el('i'))); jobRows.set(id, row); $('#jobs').prepend(row); }
  row.className = 'job ' + cls; row.children[0].textContent = title; row.children[1].textContent = msg; row.querySelector('i').style.width = pct + '%';
}
function send(file, url, title, after) {
  const id = 'u' + Math.random(), xhr = new XMLHttpRequest();
  xhr.open('POST', url); xhr.setRequestHeader('Content-Type', 'application/octet-stream');
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) showJob(id, title, '', fmtSize(e.loaded) + ' / ' + fmtSize(e.total), Math.round(e.loaded * 95 / e.total)); };
  xhr.onload = () => { let j = {}; try { j = JSON.parse(xhr.responseText); } catch {} if (xhr.status === 200) { showJob(id, title, 'done', t('done'), 100); after && after(); } else showJob(id, title, 'error', j.error || 'error', 100); };
  xhr.onerror = () => showJob(id, title, 'error', 'error', 100);
  showJob(id, title, '', '...', 0); xhr.send(file);
}
async function startJob(path, body) {
  let j = await m(path, body);
  while (j) {
    showJob('j' + j.id, j.title, j.state === 'running' ? '' : j.state, j.msg || '...', j.state === 'running' ? j.pct : 100);
    if (j.state !== 'running') { if (j.state === 'done') { allApps = null; appsLoaded = false; if (tab === 'files') loadFiles(cwd); } return; }
    await new Promise((r) => setTimeout(r, 700));
    j = await m('job?id=' + j.id);
  }
}
$('#upfile').addEventListener('change', (e) => { for (const f of e.target.files) send(f, '/api/m/upload?dir=' + encodeURIComponent(cwd) + '&name=' + encodeURIComponent(f.name), t('sending', f.name), () => loadFiles(cwd)); e.target.value = ''; });
$('#apkfile').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f && confirm(t('ask_inst', f.name))) send(f, '/api/m/install-upload?name=' + encodeURIComponent(f.name), t('installing', f.name), () => { allApps = null; appsLoaded = false; }); });
$('#instf').addEventListener('submit', (e) => { e.preventDefault(); const u = $('#insturl').value.trim(); if (u && confirm(t('ask_inst', u))) { startJob('fetch', { url: u, install: true }); $('#insturl').value = ''; } });
$('#fetchf').addEventListener('submit', (e) => { e.preventDefault(); const u = $('#fetchurl').value.trim(); if (u) { startJob('fetch', { url: u }); $('#fetchurl').value = ''; } });

// ---------- terminal ----------
const termHist = []; let termPos = 0;
function termPrint(text, cls) { const o = $('#termout'); o.append(el('span', { className: cls || '', textContent: text })); o.scrollTop = o.scrollHeight; }
$('#termf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cmd = $('#termin').value.trim(); if (!cmd) return;
  termHist.push(cmd); termPos = termHist.length; $('#termin').value = '';
  termPrint('$ ' + cmd + '\n', 'cmd');
  const r = await api('/api/m/shell', { cmd });
  if (r.status === 200) termPrint((r.out || '') + (r.out && !r.out.endsWith('\n') ? '\n' : '') + (r.cut ? t('cutoff') + '\n' : ''));
  else termPrint((r.status === 503 ? t(String(r.error).includes('allow') ? 'adb_allow' : 'adb_off') : r.error || 'error') + '\n', 'err');
});
$('#termin').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault(); termPos = Math.max(0, Math.min(termHist.length, termPos + (e.key === 'ArrowUp' ? -1 : 1))); $('#termin').value = termHist[termPos] || '';
});

// ---------- health ----------
const kv = (pairs) => pairs.filter((p) => p && p[1] != null && p[1] !== '').flatMap(([k, v]) => [el('div', { className: 'k', textContent: k }), el('div', { className: 'v', textContent: String(v) })]);
function meter(label, pct, detail) {
  const x = el('div', { className: 'meter' + (pct >= 90 ? ' max' : pct >= 75 ? ' hi' : '') }, el('div', { className: 'top' }, el('span', { textContent: label }), el('b', { textContent: detail })), el('div', { className: 'mbar' }, el('i')));
  x.querySelector('i').style.width = Math.max(0, Math.min(100, pct)) + '%'; return x;
}
let healthBusy = false;
async function loadHealth() {
  if (healthBusy) return; healthBusy = true;
  const h = await m('health'); healthBusy = false;
  if (!h || tab !== 'health') return;
  $('#hwait').hidden = true; $('#hbody').hidden = false;
  const s = h.uptime || 0, d = Math.floor(s / 86400), hr = Math.floor(s % 86400 / 3600), mi = Math.floor(s % 3600 / 60);
  $('#hsum').replaceChildren(...kv([[t('power'), h.on == null ? '' : t(h.on ? 'on' : 'off')], [t('cur'), h.app], [t('lat'), h.ping_ms + ' ms'],
    [t('up'), h.uptime == null ? '' : (d ? d + ' ' + t('day') + ' ' : '') + (d || hr ? hr + ' ' + t('hour') + ' ' : '') + mi + ' ' + t('min')]]));
  const load = [];
  if (h.cpu != null) load.push(meter('CPU' + (h.cores ? ' · ' + t('cores', h.cores) : ''), h.cpu, h.cpu + '%'));
  if (h.mem_total) { const u = h.mem_total - h.mem_free; load.push(meter('RAM', u * 100 / h.mem_total, t('used', fmtSize(u), fmtSize(h.mem_total)))); }
  if (h.disk_total) { const u = h.disk_total - h.disk_free; load.push(meter(t('disk'), u * 100 / h.disk_total, t('used', fmtSize(u), fmtSize(h.disk_total)))); }
  $('#hload').replaceChildren(...load);
  $('#htop').replaceChildren(...kv(h.top.map((p) => [p.name, p.cpu + '% CPU · ' + p.mem + '% RAM'])));
  const w = h.wifi, good = w && w.rssi != null ? T[lang].sgood[w.rssi >= -55 ? 0 : w.rssi >= -67 ? 1 : w.rssi >= -75 ? 2 : 3] : '';
  $('#hnet').replaceChildren(...kv([['Wi-Fi', w ? w.ssid : t('nowifi')], w && w.rssi != null ? [t('sig'), w.rssi + ' dBm · ' + good] : null, w && w.speed ? [t('speed'), w.speed + ' Mbps'] : null,
    w && w.freq ? [t('band'), (w.freq > 4000 ? '5 GHz' : '2.4 GHz') + ' · ' + w.freq + ' MHz'] : null,
    ...h.ips.map((i) => [t(i.if.startsWith('tun') ? 'ip_ts' : i.if.startsWith('eth') ? 'ip_eth' : 'ip_home'), i.ip])]));
  $('#hhw').replaceChildren(...kv([[t('dev'), (h.maker + ' ' + h.model).trim()], ['Android', h.android + (h.sdk ? ' (SDK ' + h.sdk + ')' : '')], [t('patch'), h.patch], ['Chip', h.chip], [t('arch'), h.abi],
    [t('ncores'), h.cores], ['RAM', h.mem_total ? fmtSize(h.mem_total) : ''], [t('scr'), h.screen + (h.fps ? ' · ' + h.fps + ' Hz' : '')], [t('dens'), h.density ? h.density + ' dpi' : '']]));
}
setInterval(() => { if (tab === 'health' && paired && !document.hidden) loadHealth(); }, 5000);

applyLang(); refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 4000);
</script>
</body>
