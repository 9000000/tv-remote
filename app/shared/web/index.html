<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111418">
<title>TV Remote</title>
<style>
  :root { --bg:#f3f4f7; --card:#fff; --ink:#1a1d23; --muted:#667080; --line:#e1e4ea; --btn:#eceff3; --btn-hi:#dde2e9; --accent:#2f6df6; --accent-ink:#fff; --bad:#d23d3d; --ok:#17894a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f25; --ink:#e9ecf1; --muted:#99a3b0; --line:#2b3139; --btn:#272d35; --btn-hi:#363e49; --accent:#5b8cff; --accent-ink:#0b1020; --bad:#ff7070; --ok:#46d283; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:light dark; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:420px; margin:0 auto; padding:14px 14px 28px; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:860px) { main.wide { max-width:860px; display:grid; grid-template-columns:400px 1fr; align-items:start; } main.wide header { grid-column:1 / -1; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; }
  .tvbox { position:relative; width:100%; max-height:70vh; background:#000; border-radius:14px; overflow:hidden; aspect-ratio:16/9; touch-action:none; }
  .tvbox video { width:100%; height:100%; object-fit:contain; display:block; } .tvbox:fullscreen { border-radius:0; aspect-ratio:auto; }
  #tvexit { display:none; position:absolute; top:8px; right:8px; width:40px; min-height:40px; border-radius:12px; background:rgba(0,0,0,.4); color:#fff; opacity:.5; }
  .tvbox:fullscreen #tvexit { display:flex; }                         /* nothing sits on the picture except this, and only in full screen */
  #tvq { font-weight:700; }
  #tvmsg { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#cbd5e1; font-size:13px; pointer-events:none; }
  #watch.on { background:var(--accent); color:var(--accent-ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:18px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } header > div { min-width:0; } header > span { flex:none; } .sub { color:var(--muted); font-size:13px; } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; } .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  h2 { font-size:12px; margin:0 0 10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  button { font:inherit; color:var(--ink); background:var(--btn); border:0; border-radius:16px; min-height:52px; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; display:flex; align-items:center; justify-content:center; gap:3px; flex-direction:column; padding:0; }
  button:hover { background:var(--btn-hi); } button:active { transform:scale(.97); } button.held { background:#f59e0b !important; color:#1a1200 !important; }
  .ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .rc { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .rrow { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%; } .rrow.three { grid-template-columns:repeat(3,1fr); } .rrow.four { grid-template-columns:repeat(4,1fr); } #numpad[hidden], #more[hidden] { display:none; } .rrow.lab button { min-height:60px; } #morebtn.on { background:var(--accent); color:var(--accent-ink); } #live.on { background:var(--accent); color:var(--accent-ink); } .rrow.five { grid-template-columns:repeat(5,1fr); gap:8px; }
  button small { font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .power { color:var(--bad); } .play { background:var(--ink); color:var(--card); } .play:hover { background:var(--ink); }
  .dpad { position:relative; width:min(250px, 70vw); aspect-ratio:1; border-radius:50%; background:var(--btn); border:1px solid var(--line); box-shadow:inset 0 2px 12px rgba(0,0,0,.18); }
  .dpad button { position:absolute; width:34%; height:34%; min-height:0; background:transparent; border-radius:50%; color:var(--muted); } .dpad .ic { width:28px; height:28px; }
  .dpad .up { top:2%; left:33%; } .dpad .down { bottom:2%; left:33%; } .dpad .left { left:2%; top:33%; } .dpad .right { right:2%; top:33%; }
  .dpad .ok { top:31%; left:31%; width:38%; height:38%; background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .vol { display:flex; align-items:center; gap:10px; width:100%; } .vol button { width:46px; min-height:46px; border-radius:50%; flex:none; } .vol .bar { flex:1; height:8px; border-radius:4px; background:var(--btn); overflow:hidden; } .vol .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .cluster { display:grid; grid-template-columns:1fr 2.4fr 1fr; gap:10px; width:100%; align-items:stretch; } .cluster .mid { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .cluster .mid button { min-height:58px; }
  .pill { display:flex; flex-direction:column; align-items:stretch; justify-content:space-between; background:var(--btn); border-radius:28px; overflow:hidden; } .pill button { flex:1; background:transparent; border-radius:0; min-height:64px; } .pill output, .pill span { text-align:center; font-weight:700; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  button.play small { color:inherit; opacity:.7; }
  .vol output { min-width:54px; white-space:nowrap; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; } .vol .on { color:var(--bad); }
  form { display:flex; gap:8px; } input { flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:50px; }
  form button { width:56px; flex:none; } .primary { background:var(--accent); color:var(--accent-ink); font-weight:700; } .primary:hover { background:var(--accent); filter:brightness(1.08); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
  .tile { background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:10px 6px 8px; min-height:0; gap:8px; font-size:12px; line-height:1.2; }
  .tile img { width:100%; aspect-ratio:16/9; object-fit:contain; border-radius:8px; display:block; } .tile span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .muted { color:var(--muted); font-size:13px; } [hidden] { display:none !important; }
  .pair { text-align:center; padding:28px 18px; } .pair p { margin:8px 0 16px; } .pair input { text-align:center; font-size:26px; letter-spacing:.3em; font-weight:700; }
  .pair form { max-width:300px; margin:0 auto; } .err { color:var(--bad); min-height:22px; font-size:14px; margin-top:10px; }
  .warn { background:rgba(245,158,11,.15); border-radius:14px; padding:10px 12px; font-size:13px; }
  nav { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:5px; position:sticky; top:8px; z-index:5; }
  nav button { flex:1; min-width:0; min-height:46px; background:transparent; border-radius:12px; font-size:11px; gap:2px; white-space:nowrap; } nav button .ic { width:20px; height:20px; }
  nav button[aria-selected=true] { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .panel { display:flex; flex-direction:column; gap:14px; }
  @media (min-width:860px) { main.wide { max-width:900px; } .panel.two { display:grid; grid-template-columns:400px 1fr; align-items:start; } }
  .small { min-height:38px; padding:0 12px; font-size:13px; border-radius:12px; flex-direction:row; gap:6px; flex:none; } .danger { color:var(--bad); }
  .list { display:flex; flex-direction:column; } .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); min-width:0; } .item:first-child { border-top:0; }
  .item .name { flex:1; min-width:0; overflow-wrap:anywhere; font-size:14px; } .item .name small { display:block; color:var(--muted); font-size:12px; } .item.click { cursor:pointer; }
  .item .acts { display:flex; gap:6px; }
  .item img, .ficon { width:36px; height:36px; border-radius:9px; flex:none; object-fit:contain; background:var(--btn); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .more { width:38px; padding:0; font-size:20px; line-height:1; }
  .sheet { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
  .sheet > div { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .sheet h3 { margin:2px 4px 6px; font-size:15px; overflow-wrap:anywhere; } .sheet button { min-height:48px; border-radius:14px; background:var(--btn); color:var(--ink); font-size:15px; flex-direction:row; }
  .sheet .primary { background:var(--accent); color:var(--accent-ink); font-weight:700; } .sheet .danger { color:var(--bad); } .sheet .quiet { background:transparent; color:var(--muted); }
  @media (min-width:640px) { .sheet { align-items:center; } .sheet > div { border-radius:20px; } }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:14px; margin:10px 0 4px; } .crumbs button { min-height:32px; padding:0 8px; background:transparent; border-radius:8px; flex-direction:row; }
  .crumbs button:last-of-type { font-weight:700; } .places { display:flex; gap:6px; flex-wrap:wrap; } .places button { min-height:34px; padding:0 12px; font-size:13px; border-radius:999px; flex-direction:row; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .tools input { min-height:40px; font-size:14px; }
  .drop { display:flex; align-items:center; justify-content:center; min-height:52px; border:1.5px dashed var(--line); border-radius:14px; margin-top:10px; cursor:pointer; color:var(--muted); font-size:14px; text-align:center; padding:6px 10px; } .drop input { display:none; }
  .kv { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; font-size:14px; } .kv .k { color:var(--muted); overflow-wrap:anywhere; min-width:0; } .kv .v { font-weight:600; text-align:right; max-width:60vw; overflow-wrap:anywhere; }
  .meter { margin:10px 0 0; font-size:14px; } .meter .top { display:flex; justify-content:space-between; gap:8px; } .mbar { height:10px; border-radius:5px; background:var(--btn); overflow:hidden; margin-top:6px; } .mbar i { display:block; height:100%; background:var(--accent); border-radius:5px; }
  .meter.hi .mbar i { background:#f59e0b; } .meter.max .mbar i { background:var(--bad); }
  .job { padding:8px 0; border-top:1px solid var(--line); font-size:13px; } .job:first-child { border-top:0; } .job.error .msg { color:var(--bad); } .job.done .msg { color:var(--ok); } .job .msg { white-space:pre-wrap; } #termhist { width:100%; margin:0 0 10px; min-height:44px; border-radius:12px; background:var(--btn); color:var(--ink); border:0; padding:0 12px; font:inherit; } #termhist[hidden] { display:none; }
  .term { background:#0b0d10; color:#d7e0ea; border-radius:12px; padding:12px; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; height:min(52vh, 460px); overflow:auto; margin:0 0 10px; }
  .term .cmd { color:#7fb0ff; } .term .err { color:#ff8a80; } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:20; } #toast.show { opacity:.94; }
  input[type=checkbox] { flex:none; min-height:0; width:18px; height:18px; padding:0; accent-color:var(--accent); }
  label.chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); cursor:pointer; margin:8px 0; }
  .lang { min-height:36px; padding:0 12px; font-size:13px; border-radius:12px; flex-direction:row; }
</style>
</head>

<main id="main">
  <header class="card">
    <div><h1 id="name">TV Remote</h1><div class="sub"><span class="dot" id="dot"></span><span id="status">...</span></div></div>
    <span style="display:flex;gap:8px"><button class="lang" id="tvq" hidden></button><button class="lang" id="tvfull" hidden><svg class="ic"><use href="#i-expand"/></svg></button><button class="lang" id="watch" hidden><svg class="ic"><use href="#i-eye"/></svg></button><button class="lang" id="lang">EN</button></span>
  </header>

  <nav id="nav" hidden>
    <button data-tab="remote" aria-selected="true"><svg class="ic"><use href="#i-apps"/></svg><span>Remote</span></button>
    <button data-tab="apps"><svg class="ic"><use href="#i-menu"/></svg><span data-t="t_apps"></span></button>
    <button data-tab="files"><svg class="ic"><use href="#i-input"/></svg><span data-t="t_files"></span></button>
    <button data-tab="install"><svg class="ic"><use href="#i-plus"/></svg><span data-t="t_install"></span></button>
    <button data-tab="health"><svg class="ic"><use href="#i-settings"/></svg><span data-t="t_health"></span></button>
    <button data-tab="term"><svg class="ic"><use href="#i-enter"/></svg><span>Terminal</span></button>
  </nav>

  <section class="card pair" id="pair" hidden>
    <h1 data-t="pair_title"></h1>
    <p class="muted" data-t="pair_text"></p>
    <button class="primary" id="pairstart" style="width:100%;max-width:300px;margin:0 auto" data-t="pair_show"></button>
    <form id="pairf" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000"><button class="primary"><svg class="ic"><use href="#i-check"/></svg></button></form>
    <div class="err" id="pairerr"></div>
  </section>

  <div class="panel two" data-panel="remote" hidden>
  <section class="card rc" id="remote">

async function api(path, body) {
  try {
    const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  } catch { return { status: 0 }; }
}

// ---------- pairing ----------
let paired = null, appsLoaded = false;
function show(isPaired) {
  if (paired === isPaired) return;
  paired = isPaired;
  $('#watch').hidden = !isPaired; $('#watch').title = t('watch'); if (!isPaired && watching) watch(false);
  $('#pair').hidden = isPaired; $('#nav').hidden = !isPaired; $('#main').classList.toggle('wide', isPaired);
  if (isPaired) showTab(tab); else document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = true; });
  if (isPaired && !appsLoaded && !EMBED) loadApps();
}
$('#pairstart').addEventListener('click', async () => {
  const r = await api('/api/pair/start', {});
  if (r.status === 200) { $('#pairf').hidden = false; $('#pairerr').textContent = t('wait'); $('#code').value = ''; $('#code').focus(); }
});
$('#pairf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await api('/api/pair/finish', { code: $('#code').value });
  if (r.status === 200) { $('#pairerr').textContent = ''; refresh(); }
  else { $('#pairerr').textContent = t(r.error === 'wrong' ? 'wrong' : 'expired'); if (r.error !== 'wrong') $('#pairf').hidden = true; $('#code').select(); }
});

// ---------- state ----------
let tvOn = false;                                              // turning it off asks first, turning it on does not
async function refresh() {
  const s = await api('/api/state');
  if (s.status === 401) { $('#name').textContent = s.name || 'TV Remote'; $('#status').textContent = ''; $('#dot').className = 'dot'; show(false); return; }
  if (s.status !== 200) { $('#status').textContent = t('lost'); $('#dot').className = 'dot bad'; return; }
  show(true); tvOn = !!s.on;
  $('#name').textContent = s.name; document.title = s.name + ' · Remote';
  $('#status').textContent = t(s.on ? 'on' : 'off'); $('#dot').className = 'dot ' + (s.on ? 'ok' : '');
  $('#volv').textContent = s.volume;
  $('#mute').classList.toggle('power', !!s.muted);
  const w = $('#adbwarn'); w.hidden = s.adb === 'ready'; if (s.adb !== 'ready') w.textContent = t(s.adb === 'allow' ? 'adb_allow' : 'adb_off');
}

const LEVELS = [4, 3, 0, 1, 2];                                       // from lightest to sharpest

  if (!on) return;

  const video = $('#tvv'), abort = new AbortController(), step = Math.round(1000 / QUAL[qual][1]);

        const kind = buf[0], data = buf.slice(5, 5 + len); buf = buf.slice(5 + len);

        else if (kind === 1) config = data;                           // goes in front of the next frame
        else if (kind === 2 || kind === 3) {

          // an empty delimiter after each frame makes it show the frame now. The codec config goes in front of its frame.

  e.preventDefault(); termPos = Math.max(0, Math.min(termHist.length, termPos + (e.key === 'ArrowUp' ? -1 : 1))); $('#termin').value = termHist[termPos] || '';
});

// ---------- health ----------
const kv = (pairs) => pairs.filter((p) => p && p[1] != null && p[1] !== '').flatMap(([k, v]) => [el('div', { className: 'k', textContent: k }), el('div', { className: 'v', textContent: String(v) })]);
function meter(label, pct, detail) {
  const x = el('div', { className: 'meter' + (pct >= 90 ? ' max' : pct >= 75 ? ' hi' : '') }, el('div', { className: 'top' }, el('span', { textContent: label }), el('b', { textContent: detail })), el('div', { className: 'mbar' }, el('i')));
  x.querySelector('i').style.width = Math.max(0, Math.min(100, pct)) + '%'; return x;
}
let healthBusy = false;
$('#freeram').addEventListener('click', async (e) => {
  e.currentTarget.disabled = true; const r = await m('free', {}); $('#freeram').disabled = false;
  if (r) { toast(t('freed', r.freed, r.after)); loadHealth(); }
});
async function loadHealth() {
  if (healthBusy) return; healthBusy = true;
  const h = await m('health'); healthBusy = false;
  if (!h || tab !== 'health') return;
  $('#hwait').hidden = true; $('#hbody').hidden = false;
  const s = h.uptime || 0, d = Math.floor(s / 86400), hr = Math.floor(s % 86400 / 3600), mi = Math.floor(s % 3600 / 60);
  $('#hsum').replaceChildren(...kv([[t('power'), h.on == null ? '' : t(h.on ? 'on' : 'off')], [t('cur'), h.app], [t('lat'), h.ping_ms + ' ms'],
    [t('up'), h.uptime == null ? '' : (d ? d + ' ' + t('day') + ' ' : '') + (d || hr ? hr + ' ' + t('hour') + ' ' : '') + mi + ' ' + t('min')]]));
  const load = [];
  if (h.cpu != null) load.push(meter('CPU' + (h.cores ? ' · ' + t('cores', h.cores) : ''), h.cpu, h.cpu + '%'));
  if (h.mem_total) { const u = h.mem_total - h.mem_free; load.push(meter('RAM', u * 100 / h.mem_total, t('used', fmtSize(u), fmtSize(h.mem_total)))); }
  if (h.disk_total) { const u = h.disk_total - h.disk_free; load.push(meter(t('disk'), u * 100 / h.disk_total, t('used', fmtSize(u), fmtSize(h.disk_total)))); }
  $('#hload').replaceChildren(...load);
  $('#htop').replaceChildren(...kv(h.top.map((p) => [p.name, p.cpu + '% CPU · ' + p.mem + '% RAM'])));
  const w = h.wifi, good = w && w.rssi != null ? T[lang].sgood[w.rssi >= -55 ? 0 : w.rssi >= -67 ? 1 : w.rssi >= -75 ? 2 : 3] : '';
  $('#hnet').replaceChildren(...kv([['Wi-Fi', w ? w.ssid : t('nowifi')], w && w.rssi != null ? [t('sig'), w.rssi + ' dBm · ' + good] : null, w && w.speed ? [t('speed'), w.speed + ' Mbps'] : null,
    w && w.freq ? [t('band'), (w.freq > 4000 ? '5 GHz' : '2.4 GHz') + ' · ' + w.freq + ' MHz'] : null,
    ...h.ips.map((i) => [t(i.if.startsWith('tun') ? 'ip_ts' : i.if.startsWith('eth') ? 'ip_eth' : 'ip_home'), i.ip])]));
  $('#hhw').replaceChildren(...kv([[t('dev'), (h.maker + ' ' + h.model).trim()], ['Android', h.android + (h.sdk ? ' (SDK ' + h.sdk + ')' : '')], [t('patch'), h.patch], ['Chip', h.chip], [t('arch'), h.abi],
    [t('ncores'), h.cores], ['RAM', h.mem_total ? fmtSize(h.mem_total) : ''], [t('scr'), h.screen + (h.fps ? ' · ' + h.fps + ' Hz' : '')], [t('dens'), h.density ? h.density + ' dpi' : '']]));
}
setInterval(() => { if (tab === 'health' && paired && !document.hidden) loadHealth(); }, 5000);

applyLang(); refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 4000);
</script>
