<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TV Games</title>
<link rel="stylesheet" href="pad.css?k=__K__">
</head>
<body>
<div id="top"><span id="who">&nbsp;</span><span id="ms"></span><button id="gear" data-act="gear" aria-label="Settings">⚙</button></div>
<div id="menu" hidden>
  <div class="row" data-act="haptic"><span id="lblHaptic">Rung</span><span class="sw" id="sw"></span></div>
  <div class="row" data-act="stick"><span id="lblStick">Stick</span><span class="sw" id="sw2"></span></div>
  <a class="row" id="add" data-act="add" hidden>＋ <span id="lblAdd">Thêm game</span></a>
</div>
<div id="tip" hidden><span id="tipText"></span><b data-act="tipx">✕</b></div>
<label id="ios" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<div id="say" hidden></div>
<div id="choices" hidden>
  <button class="ch" data-b="A">A</button><button class="ch" data-b="B">B</button><button class="ch" data-b="C">C</button><button class="ch" data-b="D">D</button>
</div>
<form id="textrow" hidden autocomplete="off"><input id="txt" maxlength="60" enterkeyhint="send" autocomplete="off" autocapitalize="off"><button id="send" type="submit"></button></form>
<main id="pad">
  <div id="shl" class="sh"></div><div id="shr" class="sh"></div>
  <div id="left"><div id="dpad"><i class="arm u"></i><i class="arm d"></i><i class="arm l"></i><i class="arm r"></i><i class="hub"></i></div></div>
  <div id="mid"></div>
  <div id="face"></div>
</main>
<div id="stick" hidden><i class="ring"></i><i class="knob"></i></div>
<script src="pad.js?k=__K__"></script>
</body>
</html>
