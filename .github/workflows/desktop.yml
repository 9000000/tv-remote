# The computer app (app/desktop) on each system it is made for: jpackage only builds for the system it runs on. Each job
# builds the app, opens it (its window included: Linux under a virtual screen), checks that the server answers and that the
# window came up, quits it through the page's /api/shutdown, and keeps the archive people download. A release (dev/release.sh)
# gets the archives attached, under names without a version so releases/latest/download/<name> always works. The two Mac
# builds are joined into one app for both chips (job mac, universal.sh), tried on each, and only that one is attached.
name: desktop
on:
  workflow_dispatch:
  push:
    paths: ["app/desktop/**", "app/shared/**", "VERSION", ".github/workflows/desktop.yml"]
  release:
    types: [published]
permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, app: "TV Remote.app/Contents/MacOS/TV Remote", res: "TV Remote.app/Contents/app/res", log: "Library/Application Support/TV Remote" }
          - { runner: macos-15-intel, app: "TV Remote.app/Contents/MacOS/TV Remote", res: "TV Remote.app/Contents/app/res", log: "Library/Application Support/TV Remote" }
          - { runner: windows-latest, app: "TV Remote/TV Remote.exe", res: "TV Remote/app/res", log: "AppData/Roaming/TV Remote" }
          - { runner: ubuntu-22.04, app: "tv-remote/bin/tv-remote", res: "tv-remote/lib/app/res", log: ".local/share/tv-remote", run: "xvfb-run -a" }
          - { runner: ubuntu-22.04-arm, app: "tv-remote/bin/tv-remote", res: "tv-remote/lib/app/res", log: ".local/share/tv-remote", run: "xvfb-run -a" }
    runs-on: ${{ matrix.runner }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-0 xvfb >/dev/null
      - if: github.event_name == 'release'                             # Meta and Caps of this very release (else the build takes the latest's)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "${{ github.event.release.tag_name }}" -p tv-remote.apk -D app/android/build
      - name: build
        run: cd app/gradle && ./gradlew --no-daemon -q :desktop:packageApp
      - name: open, check, quit
        run: |
          set -x
          app="app/desktop/build/package/${{ matrix.app }}"
          log="$HOME/${{ matrix.log }}/server.log"
          ${{ matrix.run }} "$app" &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8765/api/about && break; sleep 1; done
          echo; sleep 5
          cat "$log"
          curl -sf -o page.html http://127.0.0.1:8765/                 # not piped: grep -q stops early, curl then fails (23)
          grep -q 'data-core="mac"' page.html
          ! grep -q "no window" "$log"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/shutdown
          for i in $(seq 20); do curl -s http://127.0.0.1:8765/api/about >/dev/null || break; sleep 1; done
          ! curl -s http://127.0.0.1:8765/api/about
          grep -q "Window closed" "$log"
      - name: update itself                                            # Updater.kt: a copy that says 0.0.1, a fake GitHub serving this build
        run: |
          set -x
          pkg="$PWD/app/desktop/build/package"; a=$(cd "$pkg" && ls TV-Remote-*); n=$a; [ "$RUNNER_OS" = macOS ] && n=TV-Remote-mac.zip; v=$(cat VERSION); top="${{ matrix.app }}"; top="${top%%/*}"
          srv=upd/serve; mkdir -p $srv/repos/HoangTran0410/tv-remote/releases upd/apps
          cp "$pkg/$a" "$srv/$n"                                       # under the name Updater.kt asks for
          echo "{\"web\": \"$v\"}" > $srv/versions.json
          echo "{\"tag_name\": \"v$v\", \"body\": \"\", \"assets\": [{\"name\": \"$n\", \"browser_download_url\": \"http://127.0.0.1:8099/$n\"},
            {\"name\": \"versions.json\", \"browser_download_url\": \"http://127.0.0.1:8099/versions.json\"}]}" > $srv/repos/HoangTran0410/tv-remote/releases/latest
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          (cd $srv && $py -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 20); do curl -sf http://127.0.0.1:8099/versions.json && break; sleep 0.5; done
          if [ "$RUNNER_OS" = macOS ]; then ditto "$pkg/$top" "upd/apps/$top"; else cp -R "$pkg/$top" upd/apps/; fi
          echo 0.0.1 > "upd/apps/${{ matrix.res }}/VERSION"
          # one X server for both: xvfb-run's would go with the old app, and the new one would start with no screen
          if [ "$RUNNER_OS" = Linux ]; then Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & export DISPLAY=:99; sleep 1; fi
          TVR_RELEASES=http://127.0.0.1:8099 "upd/apps/${{ matrix.app }}" &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8765/api/about && break; sleep 1; done
          curl -s -X POST -H 'Content-Type: application/json' -d '{"do": "check"}' http://127.0.0.1:8765/api/update   # not waiting for its own first check
          for i in $(seq 90); do curl -s http://127.0.0.1:8765/api/update | grep -q '"state":"ready"' && break; sleep 1; done
          curl -s http://127.0.0.1:8765/api/update; echo
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"do": "install"}' http://127.0.0.1:8765/api/update; echo
          for i in $(seq 90); do curl -s http://127.0.0.1:8765/api/about | grep -q "\"version\":\"$v\"" && break; sleep 1; done
          cat "$HOME/${{ matrix.log }}/server.log"; ls -a upd/apps; for d in "$TMPDIR" "$TEMP" /tmp; do cat "$d/tv-remote-update.log" 2>/dev/null; done || true
          curl -s http://127.0.0.1:8765/api/about | grep "\"version\":\"$v\""     # the new one answers: swapped and opened again
          grep -qx "$v" "upd/apps/${{ matrix.res }}/VERSION"
          [ ! -e upd/apps/.tv-remote-update ]
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/shutdown
      - name: archive
        run: ls -l app/desktop/build/package/TV-Remote-*                # a missing archive fails here, not silently at upload
      - if: github.event_name == 'release' && runner.os != 'macOS'   # the Mac ones go into the universal app first
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" app/desktop/build/package/TV-Remote-* --clobber
      - uses: actions/upload-artifact@v4                               # for the job mac, and for trying a build (GitHub zips it once more)
        with:
          name: TV-Remote-${{ matrix.runner }}
          path: app/desktop/build/package/TV-Remote-*
          compression-level: 0
          retention-days: 14

  mac:                                                                 # one app for both chips, joined on each runner and tried there
    needs: app
    strategy:
      fail-fast: false
      matrix: { runner: [macos-14, macos-15-intel] }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "TV-Remote-macos-*", path: arts }
      - name: join
        run: |
          set -x
          mkdir -p a x u
          ditto -x -k arts/TV-Remote-macos-14/TV-Remote-mac-arm64.zip a
          ditto -x -k arts/TV-Remote-macos-15-intel/TV-Remote-mac-x64.zip x
          app/desktop/universal.sh "a/TV Remote.app" "x/TV Remote.app" "u/TV Remote.app"
          lipo -info "u/TV Remote.app/Contents/MacOS/TV Remote" "u/TV Remote.app/Contents/runtime/Contents/Home/lib/server/libjvm.dylib"
          codesign -v --deep "u/TV Remote.app"
          (cd u && ditto -c -k --keepParent "TV Remote.app" ../TV-Remote-mac.zip); ls -l TV-Remote-mac.zip
      - name: open, check, quit
        run: |
          set -x
          log="$HOME/Library/Application Support/TV Remote/server.log"
          "u/TV Remote.app/Contents/MacOS/TV Remote" &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8765/api/about && break; sleep 1; done
          echo; sleep 5
          cat "$log"
          curl -sf -o page.html http://127.0.0.1:8765/
          grep -q 'data-core="mac"' page.html
          ! grep -q "no window" "$log"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/shutdown
          for i in $(seq 20); do curl -s http://127.0.0.1:8765/api/about >/dev/null || break; sleep 1; done
          ! curl -s http://127.0.0.1:8765/api/about
          grep -q "Window closed" "$log"
      - if: github.event_name == 'release' && matrix.runner == 'macos-14'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" TV-Remote-mac.zip --clobber
      - if: github.event_name != 'release' && matrix.runner == 'macos-14'
        uses: actions/upload-artifact@v4
        with: { name: TV-Remote-mac-universal, path: TV-Remote-mac.zip, compression-level: 0 }
