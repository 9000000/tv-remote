<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Remote - Admin</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1a1d21;--mut:#69707a;--line:#dde0e5;--acc:#2563eb;--accfg:#fff;--bad:#c62828;--ok:#1b7f3b;--tint:#e8efff}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--fg:#e8eaed;--mut:#9aa1ab;--line:#2d3138;--acc:#5b8def;--accfg:#0b1020;--bad:#ff7b72;--ok:#56d364;--tint:#1f2a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.on{background:var(--tint);border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
button.danger{color:var(--bad)}
button.small{min-height:30px;padding:0 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
select,input{min-height:38px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.theme{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px}
.theme img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px;display:block}
.theme h2{font-size:17px;margin:0 0 4px;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:13px}
.flag{color:var(--bad);font-weight:600;margin:4px 0;overflow-wrap:anywhere}
.wall{margin-top:8px}
.wall img{max-width:200px;margin:0 6px 6px 0}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 8px 4px 0;vertical-align:top;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:13px}
.conf td:first-child{white-space:nowrap;color:var(--mut)}
.conf td:last-child{font-family:ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.result{margin-top:12px;padding:10px;border-radius:8px;background:var(--tint);overflow-wrap:anywhere}
.result pre,.stack{margin:6px 0 0;padding:10px;background:var(--bg);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.4 ui-monospace,monospace;user-select:all}
.err{color:var(--bad);margin:8px 0;overflow-wrap:anywhere}
.crash tbody tr.row{cursor:pointer}
.crash tbody tr.row:hover{background:var(--tint)}
.crash td.num{text-align:right;padding-right:12px}
.crash td.msg{overflow-wrap:anywhere;width:50%}
.crash td.kind{overflow-wrap:anywhere;max-width:220px}
.crash td.day,.crash td.st{white-space:nowrap}
.crash td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.crash th{text-align:left;padding:6px 8px;color:var(--mut);font-size:13px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile.hot b{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.charts .card{margin:0}
.charts h3{font-size:14px;margin:0 0 8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 2fr 3ch;gap:8px;align-items:center;font-size:13px;margin:3px 0;cursor:pointer}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:10px;border-radius:5px;background:var(--acc);min-width:2px}
.hb.adb i{background:var(--mut)}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.st.new{background:var(--bad);color:#fff}
.st.seen{background:var(--tint);color:var(--mut)}
.detail td{border:0}
@media (max-width:700px){
 .theme{grid-template-columns:1fr}
 .crash thead{display:none}
 .crash,.crash tbody,.crash tr,.crash td{display:block;width:100%}
 .crash tr.row{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:8px 10px;background:var(--card)}
 .crash td{border:0;padding:1px 0}
 .crash td.num{text-align:left;padding-right:0}
 .crash td.msg{max-width:none}
 .crash td[data-l]::before{content:attr(data-l) ": ";color:var(--mut);font-size:13px}
 .crash tr.detail,.crash tr.detail td{display:block;padding:0}
}
</style>
</head>
<body>
<main>
<h1>TV Remote - Admin</h1>
<nav>
 <button id="tab-themes" class="on">Chủ đề chờ duyệt</button>
 <button id="tab-crashes">Lỗi</button>
</nav>
<section id="themes"></section>
<section id="crashes" hidden></section>
</main>
<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
async function api(path, method = 'GET', params = {}) {
  const q = new URLSearchParams({ ...params, k: KEY });
  const r = await fetch(path + '?' + q, { method, headers: { 'x-admin-key': KEY } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('Lỗi ' + r.status)); e.body = j; throw e; }
  return j;
}
const img = (id, what) => '/api/themes/' + id + '/' + what + '?k=' + encodeURIComponent(KEY);
const fmtDate = (s) => new Date(s * 1000).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
function short(v) { const s = typeof v === 'string' ? v : JSON.stringify(v); return s.length > 120 ? s.slice(0, 117) + '...' : s; }

/* ---- Themes ---- */
async function loadThemes() {
  const box = $('themes');
  box.replaceChildren(h('p', { class: 'empty' }, 'Đang tải...'));
  let d;
  try { d = await api('/api/themes'); }
  catch (e) { box.replaceChildren(h('p', { class: 'err' }, e.message), h('button', { onclick: loadThemes }, 'Thử lại')); return; }
  const left = d.slots.max - d.slots.used;
  const head = h('div', { class: 'bar' },
    h('span', { class: 'grow' }, d.items.length + ' chủ đề chờ duyệt'),
    h('span', { class: 'mut' }, 'Chỗ còn lại: ' + left + ' / ' + d.slots.max + ' (đang có ' + d.slots.used + ')'),
    h('button', { class: 'small', onclick: loadThemes }, 'Tải lại'));
  box.replaceChildren(head);
  if (!d.items.length) box.append(h('p', { class: 'empty card' }, 'Không có chủ đề nào chờ duyệt.'));
  for (const t of d.items) box.append(themeCard(t, left));
}
function themeCard(t, left) {
  const conf = Object.entries(t.conf).map(([k, v]) => h('tr', {}, h('td', {}, k), h('td', {}, short(v))));
  const out = h('div');
  const ok = h('button', { class: 'primary', onclick: () => decide(t, 'approve', out, card) }, 'Duyệt');
  const no = h('button', { class: 'danger', onclick: () => decide(t, 'reject', out, card) }, 'Bỏ');
  if (left <= 0) { ok.disabled = true; ok.title = 'Danh sách đã đầy'; }
  const card = h('div', { class: 'card theme' },
    h('div', {}, h('img', { src: img(t.id, 'preview'), alt: 'Xem trước ' + t.name }),
      t.has_wall && h('div', { class: 'wall' }, h('div', { class: 'mut' }, 'Ảnh nền riêng' + ((t.walls || []).length > 1 ? ' (' + t.walls.length + ' ảnh, xoay vòng)' : '')),
        ...((t.walls || []).length ? t.walls.map((k) => 'wall/' + k) : ['wall']).map((w) => h('a', { href: img(t.id, w), target: '_blank' }, h('img', { src: img(t.id, w), alt: 'Ảnh nền' }))))),
    h('div', {},
      h('h2', {}, t.name),
      h('div', { class: 'mut' }, 'bởi ' + t.by + ' · ' + t.lang + ' · ' + fmtDate(t.at) + ' · ' + t.id),
      t.flags.map((f) => h('div', { class: 'flag' }, 'Cảnh báo: ' + f)),
      h('table', { class: 'conf' }, h('tbody', {}, conf)),
      h('div', { class: 'actions' }, ok, no), out));
  return card;
}
async function decide(t, what, out, card) {
  const btns = card.querySelectorAll('button'); btns.forEach((b) => b.disabled = true);
  out.replaceChildren();
  try {
    if (what === 'reject') {
      const why = prompt('Lý do bỏ (không bắt buộc, không được lưu):', '');
      if (why === null) { btns.forEach((b) => b.disabled = false); return; }
      await api('/api/themes/' + t.id + '/reject', 'POST');
      card.replaceChildren(h('p', { class: 'mut' }, 'Đã bỏ "' + t.name + '".'));
      return;
    }
    const r = await api('/api/themes/' + t.id + '/approve', 'POST');
    btns.forEach((b) => b.remove());
    out.replaceChildren(h('div', { class: 'result' },
      h('b', {}, 'Đã duyệt: ' + r.id),
      r.log.map((l) => h('div', {}, l)),
      h('div', { class: 'mut' }, 'Đã ghi ' + r.files.length + ' tệp. Chưa commit, chưa push. Chạy trong thư mục repo:'),
      h('pre', {}, r.cmd), h('div', { class: 'mut' }, r.note)));
  } catch (e) {
    btns.forEach((b) => b.disabled = false);
    out.replaceChildren(h('div', { class: 'err' }, e.message), (e.body && e.body.log || []).map((l) => h('div', { class: 'mut' }, l)));
  }
}

/* ---- Crashes ---- */
let CR = [];
async function loadCrashes() {
  const box = $('crashes');
  box.replaceChildren(h('p', { class: 'empty' }, 'Đang tải...'));
  try { CR = (await api('/api/crashes')).crashes; }
  catch (e) { box.replaceChildren(h('p', { class: 'err' }, e.message), h('button', { onclick: loadCrashes }, 'Thử lại')); return; }
  drawCrashes();
}
function opts(sel, vals, all) {
  const cur = sel.value; sel.replaceChildren(h('option', { value: '' }, all), vals.map((v) => h('option', { value: v }, v))); sel.value = cur;
}
// "TV Setup ADB ..." rows are AdbReport's: a user's TV that never let ADB in (debugging off, refused, not paired), not a code fault.
const isAdb = (r) => r.kind.startsWith('TV Setup ADB');
const kindOf = (k) => k.replace(/^([a-z]\w*\.)+/, '');          // android.os.NetworkOnMainThreadException -> its class name
const APPS = { setup: 'TV Setup', phone: 'Điện thoại', pc: 'Máy tính', home: 'TV Home', channels: 'TV Channels', games: 'TV Games' };
const F = { app: '', v: '', kind: '', adb: false, fresh: false };
const sum = (list, f) => list.reduce((n, r) => n + f(r), 0);
function groups(list, key) {
  const m = new Map();
  for (const r of list) { const k = key(r); m.set(k, (m.get(k) || 0) + r.n); }
  return [...m].sort((a, b) => b[1] - a[1]);
}
function chart(title, list, key, pick, adb) {
  const g = groups(list, key).slice(0, 8), max = g.length ? g[0][1] : 1;
  return h('div', { class: 'card' }, h('h3', {}, title),
    g.length ? g.map(([k, n]) => h('div', { class: 'hb' + (adb ? ' adb' : ''), title: k + ': ' + n + ' lần', onclick: pick ? () => pick(k) : null },
      h('span', {}, k), h('i', { style: 'width:' + Math.max(2, n / max * 100) + '%' }), h('em', {}, n))) : h('div', { class: 'mut' }, 'Không có'));
}
function tile(label, n, hot) { return h('div', { class: 'tile' + (hot && n ? ' hot' : '') }, h('b', {}, n), h('span', { class: 'mut' }, label)); }
function drawCrashes() {
  const box = $('crashes');
  const code = CR.filter((r) => !isAdb(r)), adb = CR.filter(isAdb);
  const fresh = code.filter((r) => r.unseen > 0);
  const fa = h('select', { 'aria-label': 'Lọc app' }), fv = h('select', { 'aria-label': 'Lọc phiên bản' });
  opts(fa, [...new Set(CR.map((r) => r.app))].sort(), 'Mọi app'); fa.value = F.app;
  opts(fv, [...new Set(CR.map((r) => r.v))].sort().reverse(), 'Mọi phiên bản'); fv.value = F.v;
  const cb = (key, label) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', ...(F[key] ? { checked: '' } : {}), onchange: (e) => { F[key] = e.target.checked; drawCrashes(); } }), label);
  fa.addEventListener('change', () => { F.app = fa.value; drawCrashes(); });
  fv.addEventListener('change', () => { F.v = fv.value; drawCrashes(); });
  const pick = (k, v) => { F[k] = F[k] === v ? '' : v; drawCrashes(); };
  const list = CR.filter((r) => (F.adb || !isAdb(r)) && (!F.fresh || r.unseen > 0) && (!F.app || r.app === F.app) && (!F.v || r.v === F.v) && (!F.kind || kindOf(r.kind) === F.kind))
    .sort((a, b) => (b.unseen > 0) - (a.unseen > 0) || b.last.localeCompare(a.last) || b.n - a.n);
  const body = h('tbody', {}, list.flatMap((r) => crashRow(r)));
  box.replaceChildren(
    h('div', { class: 'tiles' },
      tile('lỗi code mới (chưa xem)', fresh.length, true), tile('lỗi code (sig·bản)', code.length), tile('lần xảy ra', sum(code, (r) => r.n)),
      tile('máy gặp lỗi (cộng các dòng)', sum(code, (r) => r.installs)), tile('báo cáo ADB (không phải lỗi)', sum(adb, (r) => r.n))),
    h('div', { class: 'charts' },
      chart('Lỗi code theo app', code, (r) => APPS[r.app] || r.app, (k) => pick('app', Object.keys(APPS).find((a) => APPS[a] === k) || k)),
      chart('Lỗi code theo phiên bản', code, (r) => r.app + ' ' + r.v, (k) => pick('v', k.split(' ')[1])),
      chart('Lỗi code theo loại', code, (r) => kindOf(r.kind), (k) => pick('kind', k)),
      chart('Lỗi code theo ngày gần nhất', code, (r) => r.last),
      chart('ADB không nối được, theo trạng thái', adb, (r) => r.kind.split(' ')[3] || '?', null, true),
      chart('ADB không nối được, theo hãng', adb, (r) => r.brand || r.kind.split(' ').slice(4).join(' ') || '?', null, true)),
    h('div', { class: 'bar' }, h('span', { class: 'grow' }, list.length + ' dòng' + (F.kind ? ' · loại: ' + F.kind : '')),
      cb('fresh', 'Chỉ lỗi mới'), cb('adb', 'Hiện báo cáo ADB'), fa, fv,
      (F.app || F.v || F.kind) && h('button', { class: 'small', onclick: () => { F.app = F.v = F.kind = ''; drawCrashes(); } }, 'Bỏ lọc'),
      h('button', { class: 'small', onclick: loadCrashes }, 'Tải lại')),
    list.length ? h('div', { class: 'card' }, h('table', { class: 'crash' },
      h('thead', {}, h('tr', {}, ['', 'App', 'Bản', 'Loại', 'Thông báo', 'Lần', 'Máy', 'Gần nhất'].map((x) => h('th', {}, x)))), body))
      : h('p', { class: 'empty card' }, F.fresh ? 'Không có lỗi mới. Tốt.' : 'Không có lỗi nào khớp bộ lọc.'));
}
function crashRow(r) {
  const det = h('tr', { class: 'detail', hidden: true }, h('td', { colspan: 8 }));
  const st = r.unseen > 0 ? h('span', { class: 'st new', title: r.seen ? 'Lặp lại ' + r.unseen + ' lần từ lúc xem' : 'Chưa xem' }, r.seen ? '+' + r.unseen : 'Mới')
    : h('span', { class: 'st seen', title: (r.seen && r.seen.note) || '' }, 'Đã xem');
  const tr = h('tr', { class: 'row', tabindex: 0, onclick: () => toggle(r, det), onkeydown: (e) => { if (e.key === 'Enter') toggle(r, det); } },
    h('td', { class: 'st', 'data-l': 'Trạng thái' }, st), h('td', { 'data-l': 'App' }, APPS[r.app] || r.app), h('td', { 'data-l': 'Bản' }, r.v), h('td', { class: 'kind', 'data-l': 'Loại', title: r.kind }, kindOf(r.kind)),
    h('td', { class: 'msg', 'data-l': 'Thông báo' }, short(r.msg || '').slice(0, 90)),
    h('td', { class: 'num', 'data-l': 'Lần' }, r.n), h('td', { class: 'num', 'data-l': 'Máy' }, r.installs), h('td', { class: 'day', 'data-l': 'Gần nhất' }, r.last));
  return [tr, det];
}
async function toggle(r, det) {
  if (!det.hidden) { det.hidden = true; return; }
  det.hidden = false;
  const cell = det.firstChild; cell.replaceChildren(h('span', { class: 'mut' }, 'Đang tải...'));
  try {
    const s = (await api('/api/crashes', 'GET', { sig: r.sig })).crashes.sort((a, b) => (b.v === r.v) - (a.v === r.v));
    const note = h('input', { type: 'text', placeholder: 'Ghi chú: nguyên nhân / commit sửa / vì sao bỏ qua', value: (r.seen && r.seen.note) || '', style: 'flex:1;min-width:200px' });
    const said = h('span', { class: 'mut' });
    const mark = h('button', { class: 'primary small', onclick: async () => {
      mark.disabled = true;
      try { const m = await api('/api/crashes/mark', 'POST', { sig: r.sig, v: r.v, note: note.value }); r.seen = { n: r.n, note: note.value, at: m.at }; r.unseen = 0; said.textContent = 'Đã đánh dấu (checked.json, chưa commit)'; setTimeout(drawCrashes, 900); }
      catch (e) { said.textContent = e.message; mark.disabled = false; }
    } }, 'Đánh dấu đã xem');
    cell.replaceChildren(h('div', { class: 'bar' }, note, mark, said),
      ...(r.seen ? [h('div', { class: 'mut' }, 'Xem lần trước ' + (r.seen.at || '').slice(0, 16).replace('T', ' ') + ' (lúc ' + r.seen.n + ' lần): ' + (r.seen.note || '-'))] : []),
      ...s.map((x) => {
      const dev = ['brand', 'model', 'android', 'os', 'arch', 'java'].map((k) => x[k]).filter(Boolean).join(' ');
      return h('div', { class: 'card' },
        h('div', {}, h('b', {}, x.kind + ': '), x.msg),
        h('div', { class: 'mut' }, x.app + ' ' + x.v + ' · ' + x.loc + ' · ' + x.n + ' lần, ' + x.installs + ' máy · ' + x.first + ' .. ' + x.last),
        h('div', { class: 'mut' }, 'Máy: ' + (dev || '?')),
        h('pre', { class: 'stack' }, x.stack || '(không có stack)'),
        h('div', { class: 'actions' }, h('button', { class: 'danger small', onclick: () => del(r, x) }, 'Xóa (đã xử lý)')));
    }));
  } catch (e) { cell.replaceChildren(h('div', { class: 'err' }, e.message)); }
}
async function del(r) {
  if (!confirm('Xóa lỗi này (mọi phiên bản)?')) return;
  try { await api('/api/crashes', 'DELETE', { sig: r.sig }); CR = CR.filter((x) => x.sig !== r.sig); drawCrashes(); }
  catch (e) { alert(e.message); }
}

/* ---- tabs ---- */
let crashesLoaded = false;
function show(which) {
  $('themes').hidden = which !== 'themes'; $('crashes').hidden = which !== 'crashes';
  $('tab-themes').classList.toggle('on', which === 'themes'); $('tab-crashes').classList.toggle('on', which === 'crashes');
  if (which === 'crashes' && !crashesLoaded) { crashesLoaded = true; loadCrashes(); }
  try { history.replaceState(null, '', '#' + which); } catch (e) {}
}
$('tab-themes').onclick = () => show('themes');
$('tab-crashes').onclick = () => show('crashes');
loadThemes();
show(location.hash === '#crashes' ? 'crashes' : 'themes');
</script>
</body>
</html>
