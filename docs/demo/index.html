<!doctype html>
<html lang="vi" data-lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Remote: dùng thử | live demo</title>
<meta name="description" content="Try the real TV Remote web page with a made-up TV. Dùng thử trang web thật của TV Remote với một chiếc TV giả.">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="../img/icon.png">
<script>
  // the site's choice (docs/js/site.js keeps it in localStorage "lang"); the page in the frame reads the same key
  (function () {
    var l = 'vi';
    try { var m = /[?&]lang=(vi|en)/.exec(location.search); l = m ? m[1] : localStorage.getItem('lang') || (/^vi/i.test(navigator.language) ? 'vi' : 'en');
      if (l !== 'vi' && l !== 'en') l = 'vi'; localStorage.setItem('lang', l); } catch (e) {}
    document.documentElement.dataset.lang = l; document.documentElement.lang = l;
  })();
</script>
<style>
  :root { --bg:#0a0d14; --card:#141924; --line:#232a3a; --text:#e9edf5; --muted:#9aa4b8; --blue:#5b8cff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  html[data-lang="vi"] .en, html[data-lang="en"] .vi { display: none !important; }
  .bar { flex: none; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar .tag { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--blue); border-radius: 999px; padding: 3px 10px; }
  .bar p { margin: 0; color: var(--muted); flex: 1 1 260px; min-width: 0; }
  .bar a, .bar button { font: inherit; font-weight: 600; text-decoration: none; border-radius: 10px; padding: 7px 14px; border: 1px solid var(--line); color: var(--text); background: transparent; cursor: pointer; }
  .bar a.go { background: var(--blue); border-color: var(--blue); color: #fff; }
  .bar a:hover, .bar button:hover { filter: brightness(1.15); }
  @media (max-width: 600px) { .bar { padding: 6px 12px; } .bar p, .bar .home { display: none; } .bar .tag { margin-right: auto; } }
  .stage { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .msg { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; color: var(--muted); }
  .msg[hidden] { display: none; }
  .msg b { color: var(--text); display: block; margin-bottom: 6px; font-size: 17px; }
  .msg a { color: var(--blue); }
</style>
</head>
<body>
<div class="bar">
  <span class="tag"><span class="vi">Dùng thử</span><span class="en">Live demo</span></span>
  <p><span class="vi">Trang web thật của app, nối với một chiếc TV giả. Không có gì được lưu hay gửi đi.</span>
     <span class="en">The app's real web page, connected to a made-up TV. Nothing is saved or sent.</span></p>
  <a class="go" href="../#install"><span class="vi">Tải app</span><span class="en">Download</span></a>
  <a class="home" href="../"><span class="vi">Trang chủ</span><span class="en">Home</span></a>
  <button type="button" id="again"><span class="vi">Làm lại</span><span class="en">Reset</span></button>
</div>
<div class="stage">
  <div class="msg" id="msg"><div><b><span class="vi">Đang mở bản dùng thử...</span><span class="en">Opening the demo...</span></b></div></div>
  <iframe id="app" title="TV Remote" hidden></iframe>
</div>
<script src="mock.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg'), frame = document.getElementById('app');
  function broken(vi, en) {
    msg.hidden = false; frame.hidden = true;
    msg.firstElementChild.innerHTML = '<b><span class="vi">' + vi + '</span><span class="en">' + en + '</span></b>' +
      '<span class="vi">Thử tải lại trang, hoặc <a href="../#install">tải app</a>.</span><span class="en">Try reloading, or <a href="../#install">download the app</a>.</span>';
  }
  document.getElementById('again').onclick = function () { location.reload(); };
  if (!('serviceWorker' in navigator)) return broken('Trình duyệt này không chạy được bản dùng thử.', 'This browser cannot run the demo.');

  // the worker answers the page's /api calls by asking this page, which holds the made-up TV (mock.js)
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || e.data.demo !== 'api' || !e.ports[0]) return;
    window.demoApi(e.data).then(function (r) { e.ports[0].postMessage(r); },
      function (err) { e.ports[0].postMessage({ status: 500, type: 'application/json', body: JSON.stringify({ error: String(err) }) }); });
  });

  function start() {
    try { if (!localStorage.getItem('quality')) localStorage.setItem('quality', 'snap'); } catch (e) {}   // pictures as screenshots: no video stream to fake
    // the page's own "reloaded for a new language" note: open on the Living room TV's remote, not on the list of TVs (the Open button is still there)
    try { sessionStorage.setItem('langKeep', JSON.stringify({ picking: false, tab: 'remote', y: 0 })); } catch (e) {}
    frame.onload = function () { msg.hidden = true; frame.hidden = false; };
    frame.src = 'app/';
  }
  navigator.serviceWorker.register('sw.js', { scope: '/demo/' }).then(function () { return navigator.serviceWorker.ready; }).then(function () {
    // the first visit: the worker is active but does not control this page yet (it takes the frame, which is enough: the frame loads after)
    start();
  }).catch(function () { broken('Không mở được bản dùng thử.', 'The demo could not start.'); });
})();
</script>
</body>
</html>
