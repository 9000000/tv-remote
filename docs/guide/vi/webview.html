<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>“Cần cập nhật trình duyệt”</title><pre style="white-space:pre-wrap;font:15px/1.5 sans-serif;max-width:760px;margin:24px auto;padding:0 16px"># “Cần cập nhật trình duyệt”

Màn hình Quản lý trong app điện thoại dùng trình duyệt của Android (WebView). Nếu nó quá cũ, app hiện thông báo này.

1. Bấm **Mở Play Store** ngay trong thông báo.
2. Cập nhật **Android System WebView** (và Chrome nếu có).
3. Mở lại app.
