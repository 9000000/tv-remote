<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Xem tình trạng mọi TV</title><pre style="white-space:pre-wrap;font:15px/1.5 sans-serif;max-width:760px;margin:24px auto;padding:0 16px"># Xem tình trạng mọi TV

Mỗi TV đã thử có một dòng: **Đang bật**, **Chế độ chờ** hoặc **Không thấy TV**, kèm kiểu máy và app đang mở. Tự làm mới 10 giây một lần.

**Xem màn hình** (mặc định tắt): ảnh nhỏ của từng TV, 5 giây một lần. LG, Samsung, Roku và TV không ADB không có ảnh.
</pre></html>
