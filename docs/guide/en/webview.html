<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>“The browser needs an update”</title><pre style="white-space:pre-wrap;font:15px/1.5 sans-serif;max-width:760px;margin:24px auto;padding:0 16px"># “The browser needs an update”

The phone app's Manage screen uses Android's own browser (WebView). If it is too old, the app shows this notice.

1. Tap **Open the Play Store** in the notice.
2. Update **Android System WebView** (and Chrome if listed).
3. Reopen the app.
</pre></html>
