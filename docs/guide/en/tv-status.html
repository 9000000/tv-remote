<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>See every TV at a glance</title><pre style="white-space:pre-wrap;font:15px/1.5 sans-serif;max-width:760px;margin:24px auto;padding:0 16px"># See every TV at a glance

Each saved TV has a line: **On**, **Standby** or **No answer**, with its model and the app open. It refreshes every 10 seconds.

**Show screens** (off by default): a small picture of each TV every 5 seconds. LG, Samsung, Roku and TVs without ADB have none.
